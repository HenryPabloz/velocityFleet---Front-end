<!doctype html>
<html lang="pt-BR" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <title>VelocityFleet</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="VelocityFleet: gestão de frota, viagens, abastecimentos e manutenções." />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Aplica o tema salvo antes do Angular carregar, para não piscar branco.
      (function () {
        try {
          var salvo = localStorage.getItem('vf_tema');
          var tema = salvo;
          if (salvo !== 'light' && salvo !== 'dark') {
            tema = 'light';
            if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
              tema = 'dark';
            }
          }
          document.documentElement.setAttribute('data-theme', tema);
          document.documentElement.setAttribute('data-bs-theme', tema);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
