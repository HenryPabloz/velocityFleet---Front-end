<div class="vf-login" id="pagina-recuperar-senha">
  <div class="vf-login__fundo" aria-hidden="true"></div>
  <p class="vf-login__marca" aria-hidden="true">{{ 'AUTH.LOGIN.MARCA' | translate }}</p>

  <section class="vf-login__cartao" aria-labelledby="titulo-recuperar">
    <header class="vf-login__cabecalho">
      <h1 class="vf-login__titulo" id="titulo-recuperar">{{ 'AUTH.RECUPERAR.TITLE' | translate }}</h1>
    </header>
    <p class="vf-login__texto">{{ 'AUTH.RECUPERAR.TEXTO' | translate }}</p>
    <a class="btn vf-login__botao" id="link-voltar-login" routerLink="/auth/login">{{
      'AUTH.RECUPERAR.VOLTAR' | translate
    }}</a>
  </section>
</div>
