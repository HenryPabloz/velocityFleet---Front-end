<div class="vf-pagina animar-surgir" id="pagina-analytics-incidentes">
  <app-abas-analytics></app-abas-analytics>

  <app-cabecalho-pagina
    [etiqueta]="'ANALYTICS.ETIQUETA' | translate"
    [titulo]="'PAGINAS.ANALISE_INCIDENTES' | translate"
    [subtitulo]="'ANALYTICS.INCIDENTES.SUBTITULO' | translate"
  >
    <button class="btn btn-outline-secondary" type="button" id="botao-atualizar-analytics" (click)="carregar(true)">
      <app-icone nome="atualizar" [tamanho]="16"></app-icone>
      {{ 'ANALYTICS.ATUALIZAR' | translate }}
    </button>
  </app-cabecalho-pagina>

  <section class="vf-bloco vf-bloco--sem-regua vf-analytics-seletor" aria-labelledby="titulo-filtro-incidentes">
    <h2 class="visually-hidden" id="titulo-filtro-incidentes">{{ 'COMUM.FILTROS' | translate }}</h2>
    <app-campo-formulario idCampo="filtro-status-analytics" [rotulo]="'INCIDENTES.FILTRO_STATUS' | translate">
      <select vfCampoEntrada class="form-select" [(ngModel)]="filtroStatus" (ngModelChange)="mudarFiltro()">
        <option value="">{{ 'INCIDENTES.TODOS_STATUS' | translate }}</option>
        @for (status of statusDisponiveis; track status) {
          <option [value]="status">{{ 'STATUS_INCIDENTE.' + status | translate }}</option>
        }
      </select>
    </app-campo-formulario>
  </section>

  <div class="vf-secao__cabeca vf-analytics-cabeca-grafico">
    <h2 class="vf-secao__titulo" id="titulo-incidentes-analytics">{{ 'ANALYTICS.INCIDENTES.SECAO' | translate }}</h2>
    <button
      class="vf-botao-secundario"
      id="botao-ver-tabela-grafico"
      type="button"
      aria-controls="grafico-incidentes-severidade-analytics"
      [attr.aria-pressed]="verTabela"
      (click)="alternarTabela()"
    >
      <app-icone nome="tabela" [tamanho]="16"></app-icone>
      @if (verTabela) {
        {{ 'DASHBOARD.GRAFICOS.VER_GRAFICO' | translate }}
      } @else {
        {{ 'DASHBOARD.GRAFICOS.VER_TABELA' | translate }}
      }
    </button>
  </div>

  <app-bloco-grafico-itens
    idCartao="grafico-incidentes-severidade-analytics"
    [titulo]="'DASHBOARD.GRAFICOS.SEVERIDADE.TITULO' | translate"
    [subtitulo]="subtituloDoGrafico"
    [situacao]="situacao"
    [vazio]="vazio"
    [mensagemVazio]="'DASHBOARD.GRAFICOS.SEVERIDADE.VAZIO' | translate"
    [opcoes]="opcoes"
    [itens]="itens"
    [resumo]="resumo"
    [verTabela]="verTabela"
    [rotuloColunaItem]="'DASHBOARD.GRAFICOS.SEVERIDADE.COL_SEVERIDADE' | translate"
    [rotuloColunaTotal]="'DASHBOARD.GRAFICOS.SEVERIDADE.COL_INCIDENTES' | translate"
    (tentarNovamente)="carregar(true)"
  ></app-bloco-grafico-itens>
</div>
