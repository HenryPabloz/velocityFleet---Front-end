<section
  class="em-construcao animar-surgir"
  id="pagina-em-construcao"
  aria-labelledby="em-construcao-titulo"
  [attr.data-titulo]="tituloChave"
>
  <p class="em-construcao__etiqueta dado-mono">{{ 'PAGINAS.EM_CONSTRUCAO' | translate }}</p>
  <h1 class="em-construcao__titulo" id="em-construcao-titulo">{{ tituloChave | translate }}</h1>
  <p class="em-construcao__texto">{{ 'PAGINAS.EM_CONSTRUCAO_TEXTO' | translate }}</p>
</section>
